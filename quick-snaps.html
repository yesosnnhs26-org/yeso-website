<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Quick Snaps — SDOIN YES-O Camp</title>
    <style>
      :root { color-scheme: light; --ink:#151515; --muted:#707070; --line:#e8e8e8; --surface:#f6f6f7; --radius:24px; }
      * { box-sizing: border-box; }
      html { background:#fff; scroll-behavior:smooth; }
      body { margin:0; background:#fff; color:var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
      button { font:inherit; }

      .welcome { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#fff; overflow:hidden; }
      .welcome__content { position:relative; z-index:2; width:min(100% - 40px, 590px); text-align:center; padding-bottom:5vh; animation:intro-in 680ms cubic-bezier(.2,.8,.2,1) both; }
      .brand-mark { width:min(230px, 62vw); height:auto; object-fit:contain; margin:0 auto 38px; display:block; }
      h1 { letter-spacing:-.065em; font-size:clamp(2.8rem, 7vw, 5.8rem); line-height:.96; margin:0; font-weight:720; }
      .welcome p { color:var(--muted); font-size:clamp(1rem, 1.7vw, 1.2rem); line-height:1.55; margin:27px auto 34px; max-width:420px; }
      .enter { border:0; border-radius:999px; background:var(--ink); color:#fff; padding:14px 22px 15px; cursor:pointer; font-size:15px; font-weight:600; letter-spacing:-.015em; transition:transform 180ms ease, background 180ms ease; }
      .enter:hover { transform:scale(1.035); background:#343434; }
      .enter:focus-visible { outline:3px solid #83b8ff; outline-offset:4px; }
      .welcome::after { content:""; position:absolute; top:0; right:0; height:100%; width:0; background:#fff; box-shadow:-18px 0 36px rgba(0,0,0,.08); }
      body.is-opening .welcome::after { animation:wipe 1050ms cubic-bezier(.76,0,.24,1) forwards; }
      body.is-opening .welcome__content { animation:intro-out 300ms ease both; }
      body.is-open .welcome { display:none; }

      .gallery { opacity:0; transform:translateY(16px); transition:opacity 600ms ease 350ms, transform 600ms cubic-bezier(.2,.8,.2,1) 350ms; padding:34px max(22px, 4vw) 80px; }
      body.is-opening .gallery, body.is-open .gallery { opacity:1; transform:none; }
      .gallery__head { max-width:1400px; margin:0 auto 52px; display:flex; align-items:center; justify-content:space-between; min-height:50px; }
      .gallery__identity { display:flex; align-items:center; gap:13px; text-decoration:none; color:var(--ink); }
      .gallery__logo { width:51px; height:51px; object-fit:contain; }
      .gallery__identity span { font-size:15px; font-weight:650; letter-spacing:-.035em; }
      .gallery__head p { margin:0; color:var(--muted); font-size:13px; letter-spacing:-.01em; }
      .feature { max-width:1400px; margin:0 auto 76px; }
      .feature__frame { aspect-ratio: 16 / 8.6; overflow:hidden; border-radius:clamp(20px, 2.6vw, 36px); background:var(--surface); box-shadow:0 18px 55px rgba(0,0,0,.10); }
      .feature img { width:100%; height:100%; display:block; object-fit:cover; }
      .feature__caption { margin:16px 5px 0; color:var(--muted); font-size:14px; letter-spacing:-.015em; }
      .snapshots { max-width:1400px; margin:auto; }
      .snapshots__intro { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:30px; }
      h2 { margin:0; font-size:clamp(2rem, 4vw, 3.7rem); font-weight:720; letter-spacing:-.065em; line-height:1; }
      .snapshots__intro p { margin:0; max-width:290px; text-align:right; color:var(--muted); font-size:14px; line-height:1.5; }
      .masonry { columns:3 270px; column-gap:18px; }
      .shot { display:block; width:100%; break-inside:avoid; margin:0 0 18px; overflow:hidden; border-radius:18px; background:var(--surface); box-shadow:0 1px 1px rgba(0,0,0,.04), 0 10px 24px rgba(0,0,0,.055); }
      .shot img { width:100%; height:auto; display:block; transition:transform 650ms cubic-bezier(.2,.8,.2,1); }
      .shot:hover img { transform:scale(1.035); }
      .footer { max-width:1400px; border-top:1px solid var(--line); margin:76px auto 0; padding-top:20px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
      @keyframes intro-in { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
      @keyframes intro-out { to { opacity:0; transform:translateY(-9px); } }
      @keyframes wipe { 0% { width:0; } 100% { width:100%; } }
      @media (max-width:680px) { .gallery { padding-top:20px; } .gallery__head { margin-bottom:29px; } .gallery__head p { display:none; } .feature { margin-bottom:54px; } .feature__frame { aspect-ratio:1.12 / 1; } .snapshots__intro { align-items:start; display:block; margin-bottom:22px; } .snapshots__intro p { text-align:left; margin-top:11px; } .masonry { columns:2 145px; column-gap:10px; } .shot { margin-bottom:10px; border-radius:13px; } .footer { margin-top:52px; } }
      @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <section class="welcome" aria-labelledby="welcome-title">
      <div class="welcome__content">
        <img class="brand-mark" src="https://i.imgur.com/5P1wPke.png" alt="SDOIN YES-O logo" />
        <h1 id="welcome-title">Welcome to<br />Quick Snaps.</h1>
        <p>A little collection of bright, unfiltered moments from the SDOIN YES-O Camp.</p>
        <button class="enter" type="button" id="enter-gallery">Enter gallery</button>
      </div>
    </section>

    <main class="gallery" id="gallery" aria-label="SDOIN YES-O Camp Quick Snaps gallery">
      <header class="gallery__head">
        <a class="gallery__identity" href="#gallery" aria-label="Quick Snaps gallery home"><img class="gallery__logo" src="https://i.imgur.com/5P1wPke.png" alt="" /><span>Quick Snaps</span></a>
        <p>SDOIN YES-O Camp</p>
      </header>
      <section class="feature" aria-label="Featured camp snapshot">
        <div class="feature__frame"><img src="https://i.imgur.com/O1sYaMw.png" alt="Featured moment from the SDOIN YES-O Camp" /></div>
        <p class="feature__caption">The moments we will remember.</p>
      </section>
      <section class="snapshots" aria-labelledby="snapshots-title">
        <div class="snapshots__intro"><h2 id="snapshots-title">The roll.</h2><p>More snapshots from a few days well spent together.</p></div>
        <div class="masonry">
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/AGFujh5.jpeg" alt="SDOIN YES-O Camp snapshot 1" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/cJ3JrJI.jpeg" alt="SDOIN YES-O Camp snapshot 2" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/35V8Ttw.jpeg" alt="SDOIN YES-O Camp snapshot 3" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/DPAmzG4.jpeg" alt="SDOIN YES-O Camp snapshot 4" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/UGcxOe1.jpeg" alt="SDOIN YES-O Camp snapshot 5" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/eAM3I76.jpeg" alt="SDOIN YES-O Camp snapshot 6" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/zzc9bqd.jpeg" alt="SDOIN YES-O Camp snapshot 7" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/5PuRWKb.jpeg" alt="SDOIN YES-O Camp snapshot 8" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/RkdrTYa.jpeg" alt="SDOIN YES-O Camp snapshot 9" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/wJuooxu.jpeg" alt="SDOIN YES-O Camp snapshot 10" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/PhgRTCx.jpeg" alt="SDOIN YES-O Camp snapshot 11" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/7vfMqDA.jpeg" alt="SDOIN YES-O Camp snapshot 12" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/cVUHWog.jpeg" alt="SDOIN YES-O Camp snapshot 13" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/IGAGIEd.jpeg" alt="SDOIN YES-O Camp snapshot 14" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/Y124q5q.jpeg" alt="SDOIN YES-O Camp snapshot 15" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/JCbt5me.jpeg" alt="SDOIN YES-O Camp snapshot 16" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/TxBcFJa.jpeg" alt="SDOIN YES-O Camp snapshot 17" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/7JebDju.jpeg" alt="SDOIN YES-O Camp snapshot 18" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/uBuTMQJ.jpeg" alt="SDOIN YES-O Camp snapshot 19" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/Ba7CNY0.jpeg" alt="SDOIN YES-O Camp snapshot 20" /></figure>
          <figure class="shot"><img loading="lazy" src="https://i.imgur.com/LxJYRQ8.jpeg" alt="SDOIN YES-O Camp snapshot 21" /></figure>
        </div>
      </section>
      <footer class="footer"><span>Quick Snaps</span><span>SDOIN YES-O Camp</span></footer>
    </main>
    <script>
      const enter = document.getElementById('enter-gallery');
      enter.addEventListener('click', () => {
        document.body.classList.add('is-opening');
        window.setTimeout(() => { document.body.classList.remove('is-opening'); document.body.classList.add('is-open'); }, 1080);
      });
    </script>
  </body>
</html>
